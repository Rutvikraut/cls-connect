<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Screen Support - Agent Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">CLS</div>
        <div class="brand-name">CLS <span>Connect</span></div>
      </div>
      <div class="version-pill">v0.1 MVP</div>
    </div>

    <div class="page">
      <div class="page-header">
        <h1>Agent Dashboard</h1>
        <p>Generate a code, read it to the caller, view their screen.</p>
      </div>

      <div class="card">
        <div class="card-title">Session</div>
        <button class="btn btn-primary" onclick="createSession()">
          + New Session
        </button>

        <div id="codeBlock" class="hidden">
          <div class="code-display" id="codeDisplay"></div>
          <div class="code-hint">Read this code to the caller</div>
          <div class="timer-text" id="timer"></div>
        </div>

        <div style="margin-top: 10px">
          <span id="statusPill" class="status-pill hidden"></span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Caller's Screen</span>
          <button
            id="fullscreenBtn"
            class="btn btn-outline hidden"
            onclick="goFullscreen()"
          >
            ⛶ Fullscreen
          </button>
        </div>
        <div class="video-wrapper">
          <video
            id="remoteVideo"
            autoplay
            playsinline
            ondblclick="goFullscreen()"
          ></video>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Activity Log</div>
        <div id="log" class="log-box"></div>
      </div>
    </div>

    <div class="footer">© 2026 Screen Support · Internal tool</div>

    <script>
      let pc, ws, countdownInterval, pendingExpiresAt;

      function log(msg) {
        const el = document.getElementById("log");
        el.textContent += msg + "\n";
        el.scrollTop = el.scrollHeight;
        console.log(msg);
      }

      function startCountdown(expiresAtISO) {
        const expiresAt = new Date(expiresAtISO).getTime();
        if (countdownInterval) clearInterval(countdownInterval);

        const tick = () => {
          const diff = Math.max(0, expiresAt - Date.now());
          const totalSeconds = Math.floor(diff / 1000);
          const mm = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
          const ss = String(totalSeconds % 60).padStart(2, "0");
          const timerEl = document.getElementById("timer");

          if (diff <= 0) {
            timerEl.textContent = "Code expired";
            clearInterval(countdownInterval);
            handleExpiry();
            return;
          }
          timerEl.textContent = `Expires in ${mm}:${ss}`;
        };

        tick();
        countdownInterval = setInterval(tick, 1000);
      }

      function handleExpiry() {
        log("Session code expired");
        resetView("Session expired.", "error");
      }

      function setStatus(text, type) {
        const pill = document.getElementById("statusPill");
        pill.className = "status-pill " + type;
        pill.innerHTML = '<span class="dot"></span>' + text;
        pill.classList.remove("hidden");
      }

      async function createSession() {
        if (pc) {
          pc.close();
          pc = null;
        }
        if (ws) {
          ws.close();
          ws = null;
        }

        const res = await fetch("/api/create-session", { method: "POST" });
        const data = await res.json();
        const code = data.code;

        document.getElementById("codeBlock").classList.remove("hidden");
        document.getElementById("codeDisplay").textContent = code;
        setStatus("Waiting for caller to connect...", "waiting");
        log("Session created: " + code);

        connectWebSocket(code);
      }

      async function connectWebSocket(code) {
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProtocol}//${location.host}/ws?code=${code}&role=agent`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () =>
          log("Connected to signaling server, waiting for caller...");
        ws.onclose = () => log("Signaling connection closed");
        ws.onerror = (e) => log("WebSocket error: " + e.message);

        await createPeerConnection();

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === "offer") {
            log("Received offer from caller");
            await pc.setRemoteDescription(msg.offer);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: "answer", answer: pc.localDescription });
            log("Sent answer");
          } else if (msg.type === "ice-candidate") {
            try {
              await pc.addIceCandidate(msg.candidate);
            } catch (e) {
              log("Failed to add ICE candidate: " + e.message);
            }
          } else if (msg.type === "stop") {
            log("Caller stopped sharing");
            resetView("Caller ended the session.", "ended");
          } else if (msg.type === "session-info") {
            pendingExpiresAt = msg.expiresAt;
          }
        };
      }

      async function createPeerConnection() {
        const iceServers = await getIceServers();
        pc = new RTCPeerConnection({ iceServers, iceTransportPolicy: "relay" });

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            send({ type: "ice-candidate", candidate: event.candidate });
          } else {
            log("ICE gathering complete");
          }
        };

        pc.ontrack = (event) => {
          log("Caller's screen received!");
          setStatus("Connected — viewing caller's screen", "connected");
          document.getElementById("remoteVideo").srcObject = event.streams[0];
          document.getElementById("fullscreenBtn").classList.remove("hidden");

          if (pendingExpiresAt) {
            startCountdown(pendingExpiresAt);
          }
        };

        pc.onconnectionstatechange = () => {
          log("Connection state: " + pc.connectionState);
          if (
            ["disconnected", "failed", "closed"].includes(pc.connectionState)
          ) {
            resetView("Caller disconnected.", "ended");
          }
        };
      }

      async function getIceServers() {
        try {
          const res = await fetch("/api/turn-credentials");
          if (!res.ok) throw new Error("bad response");
          const turnServers = await res.json();
          log("TURN credentials loaded");
          return [{ urls: "stun:stun.l.google.com:19302" }, ...turnServers];
        } catch (e) {
          log(
            "Failed to load TURN credentials, falling back to STUN only: " +
              e.message,
          );
          return [{ urls: "stun:stun.l.google.com:19302" }];
        }
      }

      function resetView(statusText, type) {
        document.getElementById("remoteVideo").srcObject = null;
        document.getElementById("fullscreenBtn").classList.add("hidden");
        setStatus(statusText, type);
        document.getElementById("codeBlock").classList.add("hidden");
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        pendingExpiresAt = null;

        if (pc) {
          pc.close();
          pc = null;
        }
        if (ws) {
          ws.close();
          ws = null;
        }
      }

      function goFullscreen() {
        const video = document.getElementById("remoteVideo");
        if (!video.srcObject) return; // nothing to show yet
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        }
      }

      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(obj));
        }
      }
    </script>
  </body>
</html>
