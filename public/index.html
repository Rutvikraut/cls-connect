<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Screen Support</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .page.narrow {
        max-width: 440px;
      }
      .center {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">SS</div>
        <div class="brand-name">Screen <span>Support</span></div>
      </div>
    </div>

    <div class="page narrow">
      <div class="page-header center">
        <h1>Connect to Support</h1>
        <p>Enter the code your support agent gave you</p>
      </div>

      <div class="card center">
        <input
          type="text"
          id="codeInput"
          class="code-input"
          maxlength="6"
          placeholder="000000"
        />
        <button
          class="btn btn-primary btn-block"
          style="margin-top: 14px"
          onclick="connect()"
        >
          Connect
        </button>

        <div style="margin-top: 14px">
          <span id="statusPill" class="status-pill hidden"></span>
        </div>
        <div class="timer-text" id="timer"></div>
      </div>

      <div class="card">
        <div class="card-title">Your Screen</div>
        <div class="video-wrapper">
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Activity Log</div>
        <div id="log" class="log-box"></div>
      </div>
    </div>

    <div class="footer">© 2026 Screen Support</div>

    <script>
      let pc, ws, countdownInterval, localStream, pendingExpiresAt;

      function log(msg) {
        const el = document.getElementById("log");
        el.textContent += msg + "\n";
        el.scrollTop = el.scrollHeight;
        console.log(msg);
      }

      function startCountdown(expiresAtISO) {
        const expiresAt = new Date(expiresAtISO).getTime();
        if (countdownInterval) clearInterval(countdownInterval);

        const tick = () => {
          const diff = Math.max(0, expiresAt - Date.now());
          const totalSeconds = Math.floor(diff / 1000);
          const mm = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
          const ss = String(totalSeconds % 60).padStart(2, "0");
          const timerEl = document.getElementById("timer");

          if (diff <= 0) {
            timerEl.textContent = "Session expired";
            clearInterval(countdownInterval);
            handleExpiry();
            return;
          }
          timerEl.textContent = `Expires in ${mm}:${ss}`;
        };

        tick();
        countdownInterval = setInterval(tick, 1000);
      }

      function handleExpiry() {
        log("Session expired");
        try {
          send({ type: "stop" });
        } catch (e) {}
        stopCaptureAndCleanup(
          "Session expired. Enter a new code to start again.",
          "error",
        );
      }

      function setStatus(text, type) {
        const pill = document.getElementById("statusPill");
        pill.className = "status-pill " + type;
        pill.innerHTML = '<span class="dot"></span>' + text;
        pill.classList.remove("hidden");
      }

      async function connect() {
        const code = document.getElementById("codeInput").value.trim();
        if (code.length !== 6) {
          setStatus("Please enter the 6-digit code.", "error");
          return;
        }

        setStatus("Connecting...", "waiting");

        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProtocol}//${location.host}/ws?code=${code}&role=user`;
        ws = new WebSocket(wsUrl);

        ws.onopen = async () => {
          log("Connected to signaling server");
          setStatus("Connected. Starting screen share...", "waiting");
          await startShare();
        };
        ws.onclose = () => log("Signaling connection closed");
        ws.onerror = () => {
          log("WebSocket error");
          setStatus(
            "Could not connect. Check the code and try again.",
            "error",
          );
        };

        pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        });

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            send({ type: "ice-candidate", candidate: event.candidate });
          } else {
            log("ICE gathering complete");
          }
        };

        pc.onconnectionstatechange = () => {
          log("Connection state: " + pc.connectionState);
          if (pc.connectionState === "connected") {
            setStatus("Support agent is viewing your screen", "connected");
          } else if (
            ["disconnected", "failed", "closed"].includes(pc.connectionState)
          ) {
            setStatus("Session ended.", "ended");
          }
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "answer") {
            log("Received answer from agent");
            await pc.setRemoteDescription(msg.answer);
          } else if (msg.type === "ice-candidate") {
            try {
              await pc.addIceCandidate(msg.candidate);
            } catch (e) {
              log("Failed to add ICE candidate: " + e.message);
            }
          } else if (msg.type === "session-info") {
            // Don't start the countdown yet — wait until sharing actually begins.
            pendingExpiresAt = msg.expiresAt;
          }
        };
      }

      async function startShare() {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 10, max: 15 } },
        });
        const track = localStream.getVideoTracks()[0];
        if ("contentHint" in track) track.contentHint = "detail";
        track.onended = () => stopSharing();

        document.getElementById("localVideo").srcObject = localStream;
        localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
        log("Screen share started");

        if (pendingExpiresAt) {
          startCountdown(pendingExpiresAt);
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        send({ type: "offer", offer: pc.localDescription });
        log("Sent offer to agent");
      }

      // Stops the actual screen capture (turns off the browser's native
      // "sharing your screen" indicator) and tears down the connection.
      function stopCaptureAndCleanup(statusText, statusType) {
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        pendingExpiresAt = null;

        if (localStream) {
          localStream.getTracks().forEach((t) => t.stop()); // actually ends the capture
          localStream = null;
        }
        if (pc) {
          pc.close();
          pc = null;
        }
        if (ws) {
          ws.close();
          ws = null;
        }

        document.getElementById("localVideo").srcObject = null;
        setStatus(statusText, statusType);
        document.getElementById("codeInput").value = "";
      }

      function stopSharing() {
        log("Screen sharing stopped");
        try {
          send({ type: "stop" });
        } catch (e) {}
        stopCaptureAndCleanup(
          "Session ended. Enter a new code to start again.",
          "ended",
        );
      }

      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(obj));
        }
      }
    </script>
  </body>
</html>
